# The primary keep-alive is the in-app self-ping (backend KeepAliveConfig),
# which runs on the app's own clock and is unaffected by GitHub Actions cron
# delays. This workflow is a manual on-demand waker: run it from the Actions
# tab if you ever need to cold-start the backend.
name: Wake backend

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 300 \
            https://expense-backend-z1dp.onrender.com/api/actuator/health)
          echo "health check returned HTTP $STATUS"
