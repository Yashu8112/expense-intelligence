version: '3.8'

services:
  # ──────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: expense-intelligence-db
    environment:
      POSTGRES_DB:       expense_intelligence
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expense-net

  # ──────────────────────────────────────
  # Spring Boot Backend
  # ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-intelligence-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST:              postgres
      DB_PORT:              5432
      DB_NAME:              expense_intelligence
      DB_USERNAME:          postgres
      DB_PASSWORD:          postgres
      JWT_SECRET:           ${JWT_SECRET:-your-super-secret-jwt-key-minimum-256-bits-long-for-hs256}
      OPENAI_API_KEY:       ${OPENAI_API_KEY:-sk-your-openai-key}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      GITHUB_CLIENT_ID:     ${GITHUB_CLIENT_ID:-your-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-your-github-client-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - expense-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ──────────────────────────────────────
  # React Frontend
  # ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-intelligence-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    networks:
      - expense-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  expense-net:
    driver: bridge
